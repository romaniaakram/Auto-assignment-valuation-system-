{% extends 'base.html' %}
{% block title %}Login - AI Grader{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card premium-card">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">Login to AI Grader</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required id="id_username" placeholder="Enter username">
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required id="id_password" placeholder="Enter password">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3 text-muted">
            <small>Built for Romania Akram's Final Year Project</small>
        </div>
    </div>
</div>
{% endblock %}
